# Copied by hand from puIad/claude-actions/stub.yml: this repo is not owned by puIad, so the hourly sync
# does not update it or set its secrets. Needs repo secrets CLAUDE_CODE_OAUTH_TOKEN and CLAUDE_CODE_OAUTH_TOKEN_TEAM.
name: Claude

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: puIad/claude-actions/.github/workflows/reusable.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_TEAM: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_TEAM }}
